name: Codex gateway diagnostic

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Optional model override; blank probes gpt-6.2-sol and gpt-6.1-sol from recent review logs"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: codex-gateway-diagnostic
  cancel-in-progress: false

jobs:
  diagnose:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    environment: OpenAI
    steps:
      - name: Check out trusted diagnostic only
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            scripts/codex_diagnostic.py
            .github/codex/pr-review.schema.json
          sparse-checkout-cone-mode: false

      # No PR checkout, dependencies, response artifacts, or raw API logs.
      - name: Probe model acceptance and schema compatibility
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CODEX_RESPONSES_API_ENDPOINT: ${{ secrets.CODEX_RESPONSES_API_ENDPOINT }}
          DIAGNOSTIC_MODEL: ${{ inputs.model }}
        run: python3 -I scripts/codex_diagnostic.py
